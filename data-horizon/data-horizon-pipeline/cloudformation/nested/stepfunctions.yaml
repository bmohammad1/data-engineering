AWSTemplateFormatVersion: '2010-09-09'
Description: Data Horizon — 5 Step Function state machines (generated by render-stepfunctions.py).

Parameters:
  NamePrefix:
    Type: String
  StepFunctionsRoleArn:
    Type: String
  ConfigLoaderStateMachineArn:
    Type: String
  DataExtractorStateMachineArn:
    Type: String
  ExtractionFailuresQueueUrl:
    Type: String
  MapStateProcessorLambdaArn:
    Type: String
  OrchestrationBucketName:
    Type: String
  ConfigLoaderLambdaArn:
    Type: String
  PipelineStateTable:
    Type: String
  RedshiftClusterId:
    Type: String
  RedshiftDatabase:
    Type: String
  RedshiftIamRoleArn:
    Type: String
  RedshiftLoadStateMachineArn:
    Type: String
  RedshiftMasterUsername:
    Type: String
  SnsTopicArn:
    Type: String
  TransformGlueJobName:
    Type: String
  TransformationStateMachineArn:
    Type: String
  ValidatedBucketName:
    Type: String
  ValidationGlueJobName:
    Type: String

Resources:

  ConfigLoaderStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${NamePrefix}-config-loader
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Config Loader: load source config, generate map file, and prepare extraction input",
              "StartAt": "LoadConfigAndGenerateMapFile",
              "States": {
                "LoadConfigAndGenerateMapFile": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::lambda:invoke",
                  "Parameters": {
                    "FunctionName": "${ConfigLoaderLambdaArn}",
                    "Payload": {
                      "run_id.$": "$.run_id"
                    }
                  },
                  "TimeoutSeconds": 300,
                  "ResultPath": "$.orchestrator_output",
                  "ResultSelector": {
                    "run_id.$": "$.Payload.run_id",
                    "map_items_s3_key.$": "$.Payload.map_items_s3_key",
                    "concurrency.$": "$.Payload.concurrency"
                  },
                  "Retry": [
                    {
                      "ErrorEquals": [
                        "Lambda.ServiceException",
                        "Lambda.AWSLambdaException",
                        "Lambda.SdkClientException",
                        "RetryableError"
                      ],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "ConfigLoaderFailed",
                      "ResultPath": "$.error"
                    }
                  ],
                  "Next": "ConfigLoaderSuccess"
                },
                "ConfigLoaderSuccess": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.orchestrator_output.run_id",
                    "map_items_s3_key.$": "$.orchestrator_output.map_items_s3_key",
                    "concurrency.$": "$.orchestrator_output.concurrency"
                  },
                  "End": true
                },
                "ConfigLoaderFailed": {
                  "Type": "Fail",
                  "Error": "ConfigLoaderFailed",
                  "Cause": "Orchestrator Lambda failed"
                }
              }
            }
          - ConfigLoaderLambdaArn: !Ref ConfigLoaderLambdaArn
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-config-loader" }

  DataExtractorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${NamePrefix}-data-extractor
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Data Extractor: fan-out API extraction via distributed Map State",
              "StartAt": "FanOutApiExtraction",
              "States": {
                "FanOutApiExtraction": {
                  "Type": "Map",
                  "MaxConcurrencyPath": "$.concurrency",
                  "ToleratedFailurePercentage": 50,
                  "ItemReader": {
                    "Resource": "arn:aws:states:::s3:getObject",
                    "ReaderConfig": {
                      "InputType": "JSON"
                    },
                    "Parameters": {
                      "Bucket": "${OrchestrationBucketName}",
                      "Key.$": "$.map_items_s3_key"
                    }
                  },
                  "ItemSelector": {
                    "run_id.$": "$.run_id",
                    "tag_id.$": "$$.Map.Item.Value.tag_id",
                    "endpoint.$": "$$.Map.Item.Value.endpoint"
                  },
                  "ItemProcessor": {
                    "ProcessorConfig": {
                      "Mode": "DISTRIBUTED",
                      "ExecutionType": "STANDARD"
                    },
                    "StartAt": "InvokeTagExtractor",
                    "States": {
                      "InvokeTagExtractor": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::lambda:invoke",
                        "Parameters": {
                          "FunctionName": "${MapStateProcessorLambdaArn}",
                          "Payload.$": "$"
                        },
                        "TimeoutSeconds": 60,
                        "Retry": [
                          {
                            "ErrorEquals": [
                              "Lambda.ServiceException",
                              "Lambda.AWSLambdaException",
                              "Lambda.SdkClientException",
                              "Lambda.TooManyRequestsException",
                              "RetryableError"
                            ],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 3,
                            "BackoffRate": 2
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": ["States.ALL"],
                            "ResultPath": "$.catch",
                            "Next": "SendToExtractionFailures"
                          }
                        ],
                        "ResultPath": null,
                        "End": true
                      },
                      "SendToExtractionFailures": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::sqs:sendMessage",
                        "Parameters": {
                          "QueueUrl": "${ExtractionFailuresQueueUrl}",
                          "MessageBody.$": "States.Format('Extraction failed for tag: {} in run: {} | Error: {} | Cause: {}', $.tag_id, $.run_id, $.catch.Error, $.catch.Cause)"
                        },
                        "ResultPath": null,
                        "Next": "TagExtractionFailed"
                      },
                      "TagExtractionFailed": {
                        "Type": "Fail",
                        "Error": "TagExtractionFailed",
                        "Cause": "Lambda failed after all retries"
                      }
                    }
                  },
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "DataExtractorFailed",
                      "ResultPath": null
                    }
                  ],
                  "ResultPath": null,
                  "Next": "DataExtractorSuccess"
                },
                "DataExtractorSuccess": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::dynamodb:updateItem",
                  "Parameters": {
                    "TableName": "${PipelineStateTable}",
                    "Key": {
                      "PK": { "S.$": "States.Format('RUN#{}', $.run_id)" },
                      "SK": { "S": "META" }
                    },
                    "UpdateExpression": "SET extraction_end_time = :t",
                    "ExpressionAttributeValues": {
                      ":t": { "S.$": "$$.State.EnteredTime" }
                    }
                  },
                  "ResultPath": null,
                  "End": true
                },
                "DataExtractorFailed": {
                  "Type": "Fail",
                  "Error": "DataExtractorFailed",
                  "Cause": "Map state extraction failed"
                }
              }
            }
          - MapStateProcessorLambdaArn: !Ref MapStateProcessorLambdaArn
            OrchestrationBucketName: !Ref OrchestrationBucketName
            ExtractionFailuresQueueUrl: !Ref ExtractionFailuresQueueUrl
            PipelineStateTable: !Ref PipelineStateTable
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-data-extractor" }

  TransformationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${NamePrefix}-transformation
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Child3: Invoke Glue transform job then validation job in sequence",
              "StartAt": "RunTransformJob",
              "States": {
                "RunTransformJob": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::glue:startJobRun.sync",
                  "Parameters": {
                    "JobName": "${TransformGlueJobName}",
                    "Arguments": {
                      "--run_id.$": "$.run_id"
                    }
                  },
                  "TimeoutSeconds": 3600,
                  "Retry": [
                    {
                      "ErrorEquals": ["Glue.AmazonGlueException", "States.TaskFailed"],
                      "IntervalSeconds": 30,
                      "MaxAttempts": 2,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "TransformationFailed"
                    }
                  ],
                  "ResultPath": null,
                  "Next": "RunValidationJob"
                },
                "RunValidationJob": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::glue:startJobRun.sync",
                  "Parameters": {
                    "JobName": "${ValidationGlueJobName}",
                    "Arguments": {
                      "--run_id.$": "$.run_id"
                    }
                  },
                  "TimeoutSeconds": 3600,
                  "Retry": [
                    {
                      "ErrorEquals": ["Glue.AmazonGlueException", "States.TaskFailed"],
                      "IntervalSeconds": 30,
                      "MaxAttempts": 2,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "ValidationFailed"
                    }
                  ],
                  "ResultPath": null,
                  "Next": "TransformationSuccess"
                },
                "TransformationSuccess": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.run_id",
                    "status": "SUCCESS"
                  },
                  "End": true
                },
                "TransformationFailed": {
                  "Type": "Fail",
                  "Error": "TransformationFailed",
                  "Cause": "Glue transform job failed after retries"
                },
                "ValidationFailed": {
                  "Type": "Fail",
                  "Error": "ValidationFailed",
                  "Cause": "Glue validation job failed after retries"
                }
              }
            }
          - TransformGlueJobName: !Ref TransformGlueJobName
            ValidationGlueJobName: !Ref ValidationGlueJobName
            SnsTopicArn: !Ref SnsTopicArn
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-transformation" }

  RedshiftLoadStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${NamePrefix}-redshift-load
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Child4: Truncate-and-COPY all 13 staging tables from the validated S3 bucket into Redshift. Each table uses batchExecuteStatement so TRUNCATE + COPY run in a single transaction — a failed COPY rolls back the TRUNCATE, leaving the table intact. All 13 tables always run to completion (ToleratedFailureCount 13). After the Map, failed tables are collected and written to DynamoDB so operators can re-run only those tables. On any failure, raises RedshiftLoadFailed so the parent orchestrator handles alerting.",
              "StartAt": "RecordLoadStart",
              "States": {
                "RecordLoadStart": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::dynamodb:updateItem",
                  "Parameters": {
                    "TableName": "${PipelineStateTable}",
                    "Key": {
                      "PK": { "S.$": "States.Format('RUN#{}', $.run_id)" },
                      "SK": { "S": "META" }
                    },
                    "UpdateExpression": "SET load_status = :status, load_started_at = :t",
                    "ExpressionAttributeValues": {
                      ":status": { "S": "RUNNING" },
                      ":t":      { "S.$": "$$.Execution.StartTime" }
                    }
                  },
                  "ResultPath": null,
                  "Retry": [
                    {
                      "ErrorEquals": ["States.TaskFailed"],
                      "IntervalSeconds": 5,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "RedshiftLoadFailed"
                    }
                  ],
                  "Next": "BuildTableList"
                },
                "BuildTableList": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.run_id",
                    "tables": [
                      { "s3_key": "equipment",             "redshift_table": "staging.equipment" },
                      { "s3_key": "location",              "redshift_table": "staging.location" },
                      { "s3_key": "customer",              "redshift_table": "staging.customer" },
                      { "s3_key": "tag",                   "redshift_table": "staging.\"tag\"" },
                      { "s3_key": "measurements",          "redshift_table": "staging.measurement" },
                      { "s3_key": "alarms",                "redshift_table": "staging.alarm" },
                      { "s3_key": "maintenance",           "redshift_table": "staging.maintenance" },
                      { "s3_key": "events",                "redshift_table": "staging.event" },
                      { "s3_key": "contracts",             "redshift_table": "staging.customer_contract" },
                      { "s3_key": "billing",               "redshift_table": "staging.billing" },
                      { "s3_key": "inventory",             "redshift_table": "staging.inventory" },
                      { "s3_key": "regulatory_compliance", "redshift_table": "staging.regulatory_compliance" },
                      { "s3_key": "financial_forecasts",   "redshift_table": "staging.financial_forecast" }
                    ]
                  },
                  "Next": "LoadAllTables"
                },
                "LoadAllTables": {
                  "Type": "Map",
                  "ItemsPath": "$.tables",
                  "ItemSelector": {
                    "run_id.$": "$$.Execution.Input.run_id",
                    "s3_key.$": "$$.Map.Item.Value.s3_key",
                    "redshift_table.$": "$$.Map.Item.Value.redshift_table"
                  },
                  "MaxConcurrency": 5,
                  "ToleratedFailureCount": 13,
                  "Iterator": {
                    "StartAt": "BuildSqls",
                    "States": {
                      "BuildSqls": {
                        "Type": "Pass",
                        "Parameters": {
                          "run_id.$": "$.run_id",
                          "s3_key.$": "$.s3_key",
                          "redshift_table.$": "$.redshift_table",
                          "sql_truncate.$": "States.Format('TRUNCATE TABLE {}', $.redshift_table)",
                          "sql_copy.$":     "States.Format('COPY {} FROM \\'s3://${ValidatedBucketName}/validated/{}/{}\\' IAM_ROLE \\'${RedshiftIamRoleArn}\\' FORMAT AS PARQUET STATUPDATE OFF', $.redshift_table, $.run_id, $.s3_key)"
                        },
                        "Next": "TruncateAndCopy"
                      },
                      "TruncateAndCopy": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:redshiftdata:batchExecuteStatement",
                        "Parameters": {
                          "ClusterIdentifier": "${RedshiftClusterId}",
                          "Database": "${RedshiftDatabase}",
                          "DbUser": "${RedshiftMasterUsername}",
                          "Sqls.$": "States.Array($.sql_truncate, $.sql_copy)"
                        },
                        "ResultSelector": {
                          "batch_id.$": "$.Id"
                        },
                        "ResultPath": "$.batch_result",
                        "Retry": [
                          {
                            "ErrorEquals": ["Redshift.RedshiftDataException", "States.TaskFailed"],
                            "IntervalSeconds": 15,
                            "MaxAttempts": 2,
                            "BackoffRate": 2
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": ["States.ALL"],
                            "ResultPath": "$.error",
                            "Next": "TableLoadFailed"
                          }
                        ],
                        "Next": "WaitForBatch"
                      },
                      "WaitForBatch": {
                        "Type": "Wait",
                        "Seconds": 15,
                        "Next": "CheckBatchStatus"
                      },
                      "CheckBatchStatus": {
                        "Type": "Task",
                        "Resource": "arn:aws:states:::aws-sdk:redshiftdata:describeStatement",
                        "Parameters": {
                          "Id.$": "$.batch_result.batch_id"
                        },
                        "ResultSelector": {
                          "status.$": "$.Status"
                        },
                        "ResultPath": "$.batch_poll",
                        "Retry": [
                          {
                            "ErrorEquals": ["States.TaskFailed"],
                            "IntervalSeconds": 5,
                            "MaxAttempts": 3,
                            "BackoffRate": 1.5
                          }
                        ],
                        "Catch": [
                          {
                            "ErrorEquals": ["States.ALL"],
                            "ResultPath": "$.error",
                            "Next": "TableLoadFailed"
                          }
                        ],
                        "Next": "IsBatchDone"
                      },
                      "IsBatchDone": {
                        "Type": "Choice",
                        "Choices": [
                          {
                            "Variable": "$.batch_poll.status",
                            "StringEquals": "FINISHED",
                            "Next": "TableLoadSucceeded"
                          },
                          {
                            "Variable": "$.batch_poll.status",
                            "StringEquals": "FAILED",
                            "Next": "TableLoadFailed"
                          },
                          {
                            "Variable": "$.batch_poll.status",
                            "StringEquals": "ABORTED",
                            "Next": "TableLoadFailed"
                          }
                        ],
                        "Default": "WaitForBatch"
                      },
                      "TableLoadSucceeded": {
                        "Type": "Pass",
                        "Parameters": {
                          "s3_key.$": "$.s3_key",
                          "redshift_table.$": "$.redshift_table",
                          "status": "LOADED"
                        },
                        "End": true
                      },
                      "TableLoadFailed": {
                        "Type": "Pass",
                        "Parameters": {
                          "s3_key.$": "$.s3_key",
                          "redshift_table.$": "$.redshift_table",
                          "status": "FAILED"
                        },
                        "End": true
                      }
                    }
                  },
                  "ResultPath": "$.load_results",
                  "Next": "SerializeResults"
                },
                "SerializeResults": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.run_id",
                    "load_results.$": "$.load_results",
                    "load_results_str.$": "States.JsonToString($.load_results)"
                  },
                  "Next": "CheckForFailures"
                },
                "CheckForFailures": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.load_results_str",
                      "StringMatches": "*\"FAILED\"*",
                      "Next": "MarkLoadFailed"
                    }
                  ],
                  "Default": "MarkLoadSuccess"
                },
                "MarkLoadSuccess": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::dynamodb:updateItem",
                  "Parameters": {
                    "TableName": "${PipelineStateTable}",
                    "Key": {
                      "PK": { "S.$": "States.Format('RUN#{}', $.run_id)" },
                      "SK": { "S": "META" }
                    },
                    "UpdateExpression": "SET load_status = :status, load_end_time = :t, overall_status = :status, load_table_results = :results",
                    "ExpressionAttributeValues": {
                      ":status":  { "S": "SUCCESS" },
                      ":t":       { "S.$": "$$.State.EnteredTime" },
                      ":results": { "S.$": "$.load_results_str" }
                    }
                  },
                  "ResultPath": null,
                  "Retry": [
                    {
                      "ErrorEquals": ["States.TaskFailed"],
                      "IntervalSeconds": 5,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Next": "RedshiftLoadSuccess"
                },
                "RedshiftLoadSuccess": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.run_id",
                    "status": "SUCCESS",
                    "tables_loaded": 13
                  },
                  "End": true
                },
                "MarkLoadFailed": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::dynamodb:updateItem",
                  "Parameters": {
                    "TableName": "${PipelineStateTable}",
                    "Key": {
                      "PK": { "S.$": "States.Format('RUN#{}', $.run_id)" },
                      "SK": { "S": "META" }
                    },
                    "UpdateExpression": "SET load_status = :load_status, load_end_time = :t, overall_status = :overall, load_table_results = :results",
                    "ExpressionAttributeValues": {
                      ":load_status": { "S": "FAILED" },
                      ":overall":     { "S": "FAILED" },
                      ":t":           { "S.$": "$$.State.EnteredTime" },
                      ":results":     { "S.$": "$.load_results_str" }
                    }
                  },
                  "ResultPath": null,
                  "Retry": [
                    {
                      "ErrorEquals": ["States.TaskFailed"],
                      "IntervalSeconds": 5,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Next": "RedshiftLoadFailed"
                },
                "RedshiftLoadFailed": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::dynamodb:updateItem",
                  "Parameters": {
                    "TableName": "${PipelineStateTable}",
                    "Key": {
                      "PK": { "S.$": "States.Format('RUN#{}', $.run_id)" },
                      "SK": { "S": "META" }
                    },
                    "UpdateExpression": "SET load_status = :status, overall_status = :status",
                    "ExpressionAttributeValues": {
                      ":status": { "S": "FAILED" }
                    }
                  },
                  "ResultPath": null,
                  "Retry": [
                    {
                      "ErrorEquals": ["States.TaskFailed"],
                      "IntervalSeconds": 5,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Next": "LoadFailed"
                },
                "LoadFailed": {
                  "Type": "Fail",
                  "Error": "RedshiftLoadFailed",
                  "Cause": "One or more table loads failed — see load_table_results in DynamoDB META for re-run list"
                }
              }
            }
          - RedshiftClusterId: !Ref RedshiftClusterId
            RedshiftDatabase: !Ref RedshiftDatabase
            RedshiftMasterUsername: !Ref RedshiftMasterUsername
            ValidatedBucketName: !Ref ValidatedBucketName
            RedshiftIamRoleArn: !Ref RedshiftIamRoleArn
            PipelineStateTable: !Ref PipelineStateTable
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-redshift-load" }

  ModularOrchestratorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${NamePrefix}-modular-orchestrator
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "Modular Orchestrator: coordinates Config Loader → Data Extractor → Transformation → Redshift Load",
              "StartAt": "DecideGenerateRunId",
              "States": {
                "DecideGenerateRunId": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.skipGenerateRunId",
                      "IsPresent": true,
                      "Next": "CheckSkipGenerateRunId"
                    }
                  ],
                  "Default": "GenerateRunId"
                },
                "CheckSkipGenerateRunId": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.skipGenerateRunId",
                      "BooleanEquals": true,
                      "Next": "PromoteProvidedRunId"
                    }
                  ],
                  "Default": "GenerateRunId"
                },
                "PromoteProvidedRunId": {
                  "Type": "Pass",
                  "InputPath": "$.manualInputs.run_id",
                  "ResultPath": "$.run_id",
                  "Next": "AttachOptionalInputs"
                },
                "GenerateRunId": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "States.Format('RUN-{}', States.UUID())"
                  },
                  "ResultPath": "$.run_id_wrapper",
                  "Next": "SetGeneratedRunId"
                },
                "SetGeneratedRunId": {
                  "Type": "Pass",
                  "InputPath": "$.run_id_wrapper.run_id",
                  "ResultPath": "$.run_id",
                  "Next": "AttachOptionalInputs"
                },
                "AttachOptionalInputs": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.manualInputs",
                      "IsPresent": true,
                      "Next": "AttachManualInputs"
                    }
                  ],
                  "Default": "DecideStartPoint"
                },
                "AttachManualInputs": {
                  "Type": "Pass",
                  "Parameters": {
                    "run_id.$": "$.run_id",
                    "startFrom.$": "$.startFrom",
                    "manualInputs.$": "$.manualInputs"
                  },
                  "Next": "DecideStartPoint"
                },
                "DecideStartPoint": {
                  "Type": "Choice",
                  "Choices": [
                    {
                      "Variable": "$.startFrom",
                      "StringEquals": "data_extractor",
                      "Next": "PrepareExtractorInputManual"
                    },
                    {
                      "Variable": "$.startFrom",
                      "StringEquals": "transformation",
                      "Next": "PrepareTransformationInputManual"
                    }
                  ],
                  "Default": "RunConfigLoader"
                },
                "RunConfigLoader": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::states:startExecution.sync:2",
                  "Parameters": {
                    "StateMachineArn": "${ConfigLoaderStateMachineArn}",
                    "Input": {
                      "run_id.$": "$.run_id"
                    }
                  },
                  "TimeoutSeconds": 600,
                  "ResultSelector": {
                    "output.$": "$.Output"
                  },
                  "ResultPath": "$.config_loader",
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "NotifyOrchestratorFailure"
                    }
                  ],
                  "Next": "PrepareExtractorInputFromConfig"
                },
                "PrepareExtractorInputFromConfig": {
                  "Type": "Pass",
                  "Parameters": {
                    "extractor_input.$": "$.config_loader.output"
                  },
                  "ResultPath": "$.prepared",
                  "Next": "RunDataExtractor"
                },
                "PrepareExtractorInputManual": {
                  "Type": "Pass",
                  "InputPath": "$.run_id",
                  "ResultPath": "$.manualInputs.run_id",
                  "Next": "SetExtractorInput"
                },
                "SetExtractorInput": {
                  "Type": "Pass",
                  "Parameters": {
                    "extractor_input.$": "$.manualInputs"
                  },
                  "ResultPath": "$.prepared",
                  "Next": "RunDataExtractor"
                },
                "RunDataExtractor": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::states:startExecution.sync:2",
                  "Parameters": {
                    "StateMachineArn": "${DataExtractorStateMachineArn}",
                    "Input.$": "$.prepared.extractor_input"
                  },
                  "TimeoutSeconds": 7200,
                  "ResultSelector": {
                    "output.$": "$.Output"
                  },
                  "ResultPath": "$.data_extractor",
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "NotifyOrchestratorFailure"
                    }
                  ],
                  "Next": "PrepareTransformationInputFromExtractor"
                },
                "PrepareTransformationInputFromExtractor": {
                  "Type": "Pass",
                  "Parameters": {
                    "transformation_input.$": "$.data_extractor.output"
                  },
                  "ResultPath": "$.prepared",
                  "Next": "RunTransformation"
                },
                "PrepareTransformationInputManual": {
                  "Type": "Pass",
                  "InputPath": "$.run_id",
                  "ResultPath": "$.manualInputs.run_id",
                  "Next": "SetTransformationInput"
                },
                "SetTransformationInput": {
                  "Type": "Pass",
                  "Parameters": {
                    "transformation_input.$": "$.manualInputs"
                  },
                  "ResultPath": "$.prepared",
                  "Next": "RunTransformation"
                },
                "RunTransformation": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::states:startExecution.sync:2",
                  "Parameters": {
                    "StateMachineArn": "${TransformationStateMachineArn}",
                    "Input.$": "$.prepared.transformation_input"
                  },
                  "TimeoutSeconds": 3600,
                  "ResultSelector": {
                    "output.$": "$.Output"
                  },
                  "ResultPath": "$.transformation",
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "NotifyOrchestratorFailure"
                    }
                  ],
                  "Next": "PrepareRedshiftInputFromTransformation"
                },
                "PrepareRedshiftInputFromTransformation": {
                  "Type": "Pass",
                  "Parameters": {
                    "redshift_input.$": "$.transformation.output"
                  },
                  "ResultPath": "$.prepared",
                  "Next": "RunRedshiftLoad"
                },
                "RunRedshiftLoad": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::states:startExecution.sync:2",
                  "Parameters": {
                    "StateMachineArn": "${RedshiftLoadStateMachineArn}",
                    "Input.$": "$.prepared.redshift_input"
                  },
                  "TimeoutSeconds": 1800,
                  "ResultSelector": {
                    "output.$": "$.Output"
                  },
                  "ResultPath": "$.redshift_load",
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "ResultPath": "$.error",
                      "Next": "NotifyOrchestratorFailure"
                    }
                  ],
                  "Next": "OrchestratorSuccess"
                },
                "OrchestratorSuccess": {
                  "Type": "Succeed"
                },
                "NotifyOrchestratorFailure": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::sns:publish",
                  "Parameters": {
                    "TopicArn": "${SnsTopicArn}",
                    "Subject": "Data Horizon Pipeline Failed",
                    "Message.$": "States.Format('Pipeline failed at step: {}', $.error.Cause)"
                  },
                  "Next": "OrchestratorFailed"
                },
                "OrchestratorFailed": {
                  "Type": "Fail",
                  "Error": "OrchestratorFailed",
                  "Cause": "One of the child step functions failed"
                }
              }
            }
          - ConfigLoaderStateMachineArn: !Ref ConfigLoaderStateMachineArn
            DataExtractorStateMachineArn: !Ref DataExtractorStateMachineArn
            TransformationStateMachineArn: !Ref TransformationStateMachineArn
            RedshiftLoadStateMachineArn: !Ref RedshiftLoadStateMachineArn
            SnsTopicArn: !Ref SnsTopicArn
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-modular-orchestrator" }

Outputs:
  ConfigLoaderStateMachineArn:
    Value: !Ref ConfigLoaderStateMachine
  DataExtractorStateMachineArn:
    Value: !Ref DataExtractorStateMachine
  TransformationStateMachineArn:
    Value: !Ref TransformationStateMachine
  RedshiftLoadStateMachineArn:
    Value: !Ref RedshiftLoadStateMachine
  ModularOrchestratorStateMachineArn:
    Value: !Ref ModularOrchestratorStateMachine
    Description: Parent state machine, target of the EventBridge schedule rule.
