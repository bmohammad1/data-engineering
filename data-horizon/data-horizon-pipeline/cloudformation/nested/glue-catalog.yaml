AWSTemplateFormatVersion: '2010-09-09'
Description: Data Horizon — Glue Data Catalog database and 16 tables (mirrors terraform/modules/glue_catalog).

Parameters:
  NamePrefix:
    Type: String
  RawBucketName:
    Type: String
  CleanedBucketName:
    Type: String
  ValidatedBucketName:
    Type: String
  BadBucketName:
    Type: String

Mappings:
  Serdes:
    Json:
      InputFormat: org.apache.hadoop.mapred.TextInputFormat
      OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
      SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
    Parquet:
      InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
      OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
      SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

Resources:

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        # name_prefix uses hyphens (e.g. data-horizon-dev); terraform converts to underscores.
        # We cannot do !Sub + replace in CFN; the deploy script passes a sanitized NamePrefix.
        # Here we just append _db and rely on the caller to have replaced hyphens.
        Name: !Sub
          - "${SanitizedPrefix}_db"
          - SanitizedPrefix: !Join ["_", !Split ["-", !Ref NamePrefix]]
        Description: Data Horizon pipeline catalog database

  # ---------- Raw envelope table ----------
  RawDataTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: raw_data
        Description: Raw TagResponse JSON files, one object per tag per run
        TableType: EXTERNAL_TABLE
        Parameters: { classification: json }
        StorageDescriptor:
          Location: !Sub s3://${RawBucketName}/raw/
          InputFormat: !FindInMap [Serdes, Json, InputFormat]
          OutputFormat: !FindInMap [Serdes, Json, OutputFormat]
          SerdeInfo:
            SerializationLibrary: !FindInMap [Serdes, Json, SerializationLibrary]
          Columns:
            - { Name: run_id, Type: string }
            - { Name: tag_id, Type: string }
            - { Name: data,   Type: string }

  # ---------- Cleaned tables (JSON) ----------
  CleanedMeasurementsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: cleaned_measurements
        Description: Cleaned measurement records (JSON)
        TableType: EXTERNAL_TABLE
        Parameters: { classification: json }
        StorageDescriptor:
          Location: !Sub s3://${CleanedBucketName}/cleaned/
          InputFormat: !FindInMap [Serdes, Json, InputFormat]
          OutputFormat: !FindInMap [Serdes, Json, OutputFormat]
          SerdeInfo:
            SerializationLibrary: !FindInMap [Serdes, Json, SerializationLibrary]
          Columns:
            - { Name: MeasurementID, Type: string }
            - { Name: TagID,         Type: string }
            - { Name: Timestamp,     Type: timestamp }
            - { Name: Value,         Type: double }
            - { Name: QualityFlag,   Type: string }
            - { Name: _run_id,       Type: string }
            - { Name: _ingested_at,  Type: timestamp }

  CleanedAlarmsTable:
