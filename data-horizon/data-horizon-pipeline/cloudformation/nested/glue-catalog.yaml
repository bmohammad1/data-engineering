            - { Name: AlarmType,      Type: string }
            - { Name: ThresholdValue, Type: double }
            - { Name: Timestamp,      Type: timestamp }
            - { Name: Status,         Type: string }
            - { Name: _run_id,        Type: string }
            - { Name: _ingested_at,   Type: timestamp }

