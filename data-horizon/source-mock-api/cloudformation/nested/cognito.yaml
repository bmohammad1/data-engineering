AWSTemplateFormatVersion: '2010-09-09'
Description: Mock Source API — Cognito M2M user pool, domain, resource server, app client.

Parameters:
  Environment:
    Type: String

Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub mock-source-api-${Environment}
      UserPoolTier: LITE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub mock-source-api-${AWS::AccountId}-${Environment}
      UserPoolId: !Ref UserPool

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: mock-source-api
      Name: MockSourceAPI
      Scopes:
        - ScopeName: read
          ScopeDescription: Read access to tag data

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub mock-source-api-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [mock-source-api/read]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders: [COGNITO]
      AccessTokenValidity: 1440
      TokenValidityUnits:
        AccessToken: minutes

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  UserPoolDomain:
    Value: !Ref UserPoolDomain
  ClientId:
    Value: !Ref UserPoolClient
  TokenUrl:
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
