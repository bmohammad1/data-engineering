AWSTemplateFormatVersion: '2010-09-09'
Description: Mock Source API — Lambda function + IAM role + log group.

Parameters:
  Environment:
    Type: String
  LambdaMemorySize:
    Type: Number
    Default: 256
  LambdaTimeout:
    Type: Number
    Default: 30
  ArtifactBucket:
    Type: String
  LambdaS3Key:
    Type: String
  LogRetentionDays:
    Type: Number
    Default: 30

Resources:

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mock-source-api-${Environment}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal: { Service: lambda.amazonaws.com }
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub mock-source-api-${Environment}
      Role: !GetAtt LambdaRole.Arn
      Handler: lambda_handler.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref LambdaS3Key

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/mock-source-api-${Environment}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  FunctionArn:
    Value: !GetAtt Function.Arn
  FunctionName:
    Value: !Ref Function
  InvokeArn:
    Value: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations
